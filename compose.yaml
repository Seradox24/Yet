name: yet-lrsql

services:
  postgres:
    image: postgres:16.15-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lrsql}
      POSTGRES_USER: ${POSTGRES_USER:-lrsql}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD en .env.prod}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - yet-internal
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  lrsql:
    image: yetanalytics/lrsql:v0.9.7@sha256:e80e9bf9f715d93e9e2ad084dcec7a9847087d24485b71d126aede22e4d40827
    platform: linux/amd64
    restart: unless-stopped
    command:
      - /lrsql/bin/run_postgres.sh
    depends_on:
      postgres:
        condition: service_healthy
        restart: true
    environment:
      LRSQL_ADMIN_USER_DEFAULT: ${LRSQL_ADMIN_USER:?Defina LRSQL_ADMIN_USER en .env.prod}
      LRSQL_ADMIN_PASS_DEFAULT: ${LRSQL_ADMIN_PASSWORD:?Defina LRSQL_ADMIN_PASSWORD en .env.prod}
      LRSQL_API_KEY_DEFAULT: ${LRSQL_API_KEY:?Defina LRSQL_API_KEY en .env.prod}
      LRSQL_API_SECRET_DEFAULT: ${LRSQL_API_SECRET:?Defina LRSQL_API_SECRET en .env.prod}
      LRSQL_DB_HOST: postgres
      LRSQL_DB_PORT: 5432
      LRSQL_DB_NAME: ${POSTGRES_DB:-lrsql}
      LRSQL_DB_USER: ${POSTGRES_USER:-lrsql}
      LRSQL_DB_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD en .env.prod}
      LRSQL_POOL_INITIALIZATION_FAIL_TIMEOUT: 60000
      LRSQL_ENABLE_HTTP: "true"
      LRSQL_HTTP_HOST: "0.0.0.0"
      LRSQL_HTTP_PORT: "8080"
      LRSQL_ENABLE_ADMIN_UI: "true"
      LRSQL_ALLOW_ALL_ORIGINS: "false"
      LRSQL_ALLOWED_ORIGINS: ${LRSQL_PUBLIC_URL:?Defina LRSQL_PUBLIC_URL en .env.prod}
      LRSQL_AUTHORITY_URL: ${LRSQL_PUBLIC_URL:?Defina LRSQL_PUBLIC_URL en .env.prod}
      LRSQL_LOG_LEVEL: ${LRSQL_LOG_LEVEL:-INFO}
    ports:
      - "127.0.0.1:${LRSQL_HTTP_PORT:?Defina LRSQL_HTTP_PORT en .env.prod}:8080"
    networks:
      - yet-internal
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -T 4 -O /dev/null http://127.0.0.1:8080/admin
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    stop_grace_period: 30s

volumes:
  postgres_data:
    name: yet-lrsql-postgres-data

networks:
  yet-internal:
    name: yet-lrsql-internal
    driver: bridge
