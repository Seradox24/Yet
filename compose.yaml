name: yet-lrsql

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16.15-alpine3.24@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab}
    restart: unless-stopped
    cpus: ${POSTGRES_CPUS:-1}
    mem_limit: ${POSTGRES_MEMORY:-512m}
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lrsql}
      POSTGRES_USER: ${POSTGRES_USER:-lrsql}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD en .env.prod}
    volumes:
      - ${POSTGRES_DATA_PATH:-postgres_data}:/var/lib/postgresql/data
    networks:
      - yet-internal
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  lrsql:
    image: ${LRSQL_IMAGE:-yetanalytics/lrsql:v0.9.11@sha256:bf5661ab216d07175f6e429951bf53c79f6070d54812285ea4c208f991cf0a04}
    platform: linux/amd64
    restart: unless-stopped
    cpus: ${LRSQL_CPUS:-2}
    mem_limit: ${LRSQL_MEMORY:-1536m}
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    command:
      - /lrsql/bin/run_postgres.sh
    depends_on:
      postgres:
        condition: service_healthy
        restart: true
    environment:
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--XX:MaxRAMPercentage=60.0 -XX:InitialRAMPercentage=10.0}
      LRSQL_ADMIN_USER_DEFAULT: ${LRSQL_ADMIN_USER:?Defina LRSQL_ADMIN_USER en .env.prod}
      LRSQL_ADMIN_PASS_DEFAULT: ${LRSQL_ADMIN_PASSWORD:?Defina LRSQL_ADMIN_PASSWORD en .env.prod}
      LRSQL_API_KEY_DEFAULT: ${LRSQL_API_KEY:?Defina LRSQL_API_KEY en .env.prod}
      LRSQL_API_SECRET_DEFAULT: ${LRSQL_API_SECRET:?Defina LRSQL_API_SECRET en .env.prod}
      LRSQL_DB_HOST: postgres
      LRSQL_DB_PORT: 5432
      LRSQL_DB_NAME: ${POSTGRES_DB:-lrsql}
      LRSQL_DB_USER: ${POSTGRES_USER:-lrsql}
      LRSQL_DB_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD en .env.prod}
      LRSQL_POOL_INITIALIZATION_FAIL_TIMEOUT: 60000
      LRSQL_ENABLE_HTTP: "true"
      LRSQL_ENABLE_HTTPS: "false"
      LRSQL_HTTP_HOST: "0.0.0.0"
      LRSQL_HTTP_PORT: "8080"
      LRSQL_ENABLE_ADMIN_UI: "true"
      LRSQL_ALLOW_ALL_ORIGINS: "false"
      LRSQL_ALLOWED_ORIGINS: ${LRSQL_PUBLIC_URL:?Defina LRSQL_PUBLIC_URL en .env.prod}
      LRSQL_AUTHORITY_URL: ${LRSQL_PUBLIC_URL:?Defina LRSQL_PUBLIC_URL en .env.prod}
      LRSQL_LOG_LEVEL: ${LRSQL_LOG_LEVEL:-INFO}
    ports:
      - "127.0.0.1:${LRSQL_HTTP_PORT:?Defina LRSQL_HTTP_PORT en .env.prod}:8080"
    networks:
      - yet-internal
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -T 4 -O /dev/null http://127.0.0.1:8080/admin
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    stop_grace_period: 30s

volumes:
  postgres_data:
    name: ${COMPOSE_PROJECT_NAME:-yet-lrsql}-postgres-data

networks:
  yet-internal:
    name: ${COMPOSE_PROJECT_NAME:-yet-lrsql}-internal
    driver: bridge
